bind 0.0.0.0
protected-mode no
port 6379

maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

loglevel notice
logfile ""

slowlog-log-slower-than 10000
slowlog-max-len 128

tcp-backlog 511

timeout 300

tcp-keepalive 60

databases 16

activedefrag yes
